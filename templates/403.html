{% extends 'base.html' %}
{% load static %}

{% block title %}Access Denied - {{ site_settings.school_name }}{% endblock %}

{% block content %}
<section class="section-padding text-center" style="min-height: 50vh; display: flex; align-items: center; justify-content: center;">
  <div class="container">
    <h1 style="font-size: 4rem; color: var(--primary); margin-bottom: 16px;">403</h1>
    <h2 style="margin-bottom: 24px;">Access Denied</h2>
    <p style="margin-bottom: 32px; font-size: 1.1rem; color: var(--text-muted);">
      You don't have permission to view this page.
    </p>
    <div style="display: flex; gap: 16px; justify-content: center;">
      <a href="{% url 'home' %}" class="btn btn-outline" style="min-height: 44px; display: inline-flex; align-items: center;">
        Go to home
      </a>
      <a href="{% url 'dashboard' %}" class="btn btn-primary" style="min-height: 44px; display: inline-flex; align-items: center;">
        Back to dashboard
      </a>
    </div>
  </div>
</section>
{% endblock %}
