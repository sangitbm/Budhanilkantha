{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found - {{ site_settings.school_name }}{% endblock %}

{% block content %}
<section class="section-padding text-center" style="min-height: 50vh; display: flex; align-items: center; justify-content: center;">
  <div class="container">
    <h1 style="font-size: 4rem; color: var(--primary); margin-bottom: 16px;">404</h1>
    <h2 style="margin-bottom: 24px;">Page Not Found</h2>
    <p style="margin-bottom: 32px; font-size: 1.1rem; color: var(--text-muted);">
      Sorry, the page you are looking for does not exist or has been moved.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary" style="min-height: 44px; display: inline-flex; align-items: center;">
      Return to Homepage
    </a>
  </div>
</section>
{% endblock %}
