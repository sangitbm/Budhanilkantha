{% extends 'base.html' %}

{% block title %}Admission Form - Budhanilkantha School{% endblock %}

{% block content %}
<style>
  .admission-form-wrapper {
    max-width: 600px; 
    margin: 0 auto; 
    background: var(--white); 
    padding: 40px; 
    border-radius: var(--radius); 
    box-shadow: var(--shadow);
  }
  
  .admission-subtitle {
    margin-bottom: 24px;
  }
  
  .btn-full-width {
    width: 100%; 
    margin-top: 16px;
  }
</style>

<div class="container section-padding">
    <div class="admission-form-wrapper">

        <h1 class="section-title text-center">Admissions Application</h1>
        <p class="text-center admission-subtitle">Please fill out the form below to apply.</p>
        
        <form method="POST" onsubmit="
            var btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Submitting... ⏳';
            btn.style.opacity = '0.7';
            btn.style.cursor = 'wait';
            btn.disabled = true;
        ">
            {% csrf_token %}
            {{ form.as_p }}

            <button id="submitBtn" type="submit" class="btn btn-primary btn-full-width">
                Submit Application
            </button>
        </form>

    </div>
</div>
{% endblock %}
{% block footer_cta %}{% endblock %}
